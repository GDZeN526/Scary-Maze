<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Maze Game</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        touch-action:none;
        user-select:none;
    }

    body{
        background:black;
        overflow:hidden;
        font-family:Arial, sans-serif;
    }

    canvas{
        display:block;
        margin:auto;
        background:black;
        image-rendering:pixelated;
    }

    #levelText{
        position:fixed;
        top:10px;
        left:50%;
        transform:translateX(-50%);
        color:white;
        font-size:24px;
        z-index:10;
    }

    #mobileControls{
        position:fixed;
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
        width:220px;
        height:220px;
        display:none;
        z-index:20;
    }

    .btn{
        position:absolute;
        width:70px;
        height:70px;
        background:#111;
        border:2px solid cyan;
        color:white;
        font-size:28px;
        border-radius:12px;
    }

    #up{ top:0; left:75px; }
    #left{ top:75px; left:0; }
    #right{ top:75px; right:0; }
    #down{ bottom:0; left:75px; }

    #jumpscare{
        position:fixed;
        inset:0;
        background:black;
        display:none;
        justify-content:center;
        align-items:center;
        z-index:999;
    }

    #jumpscare video{
        width:100%;
        height:100%;
        object-fit:cover;
    }

</style>
</head>
<body>

<div id="levelText">Level 1</div>

<canvas id="game"></canvas>

<div id="mobileControls">
    <button class="btn" id="up">▲</button>
    <button class="btn" id="down">▼</button>
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
</div>

<div id="jumpscare">
    <video id="scareVideo" src="JS.webm"></video>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 600;
canvas.height = 600;

const tile = 30;

const levels = [

[
"####################",
"#S.................#",
"##################.#",
"#..................#",
"#.##################",
"#..................F",
"####################"
],

[
"####################",
"#S....#............#",
"###.#.#.##########.#",
"#...#.#..........#.#",
"#.###.##########.#.#",
"#................#F#",
"####################"
],

[
"####################",
"#S.................#",
"###########.########",
"#.........#........#",
"#.#######.########.#",
"#.#..............#.#",
"#.#.############.#.#",
"#................#F#",
"####################"
],

[
"####################",
"#S.....#...........#",
"#####.#.#.##########",
"#.....#.#..........#",
"#.#####.##########.#",
"#.#..............#.#",
"#.#.############.#.#",
"#.#............#.#F#",
"####################"
],

[
"####################",
"#S.#...............#",
"#.#.##############.#",
"#.#..............#.#",
"#.##############.#.#",
"#................#.#",
"################.#.#",
"#................#F#",
"####################"
]

];

let level = 0;

let player = {
    x:0,
    y:0,
    size:20,
    speed:2
};

let startPos = {x:0,y:0};
let finishPos = {x:0,y:0};

const keys = {};

function isMobile(){
    return window.innerWidth < 900;
}

if(isMobile()){
    document.getElementById("mobileControls").style.display = "block";
}

function loadLevel(index){

    const map = levels[index];

    for(let y=0; y<map.length; y++){
        for(let x=0; x<map[y].length; x++){

            const c = map[y][x];

            if(c === "S"){
                player.x = x * tile + 5;
                player.y = y * tile + 5;

                startPos.x = player.x;
                startPos.y = player.y;
            }

            if(c === "F"){
                finishPos.x = x * tile;
                finishPos.y = y * tile;
            }
        }
    }

    document.getElementById("levelText").innerText =
        "Level " + (index + 1);
}

function drawMap(){

    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const map = levels[level];

    for(let y=0; y<map.length; y++){
        for(let x=0; x<map[y].length; x++){

            const c = map[y][x];

            if(c === "." || c === "S" || c === "F"){
                ctx.fillStyle = "cyan";
                ctx.fillRect(x*tile, y*tile, tile, tile);
            }

            if(c === "F"){
                ctx.fillStyle = "lime";
                ctx.fillRect(x*tile+8, y*tile+8, 14, 14);
            }
        }
    }
}

function drawPlayer(){
    ctx.fillStyle = "red";
    ctx.fillRect(player.x, player.y, player.size, player.size);
}

function resetPlayer(){
    player.x = startPos.x;
    player.y = startPos.y;
}

function checkCollision(){

    const corners = [
        [player.x, player.y],
        [player.x + player.size, player.y],
        [player.x, player.y + player.size],
        [player.x + player.size, player.y + player.size]
    ];

    for(const c of corners){

        const tx = Math.floor(c[0] / tile);
        const ty = Math.floor(c[1] / tile);

        const map = levels[level];

        if(
            !map[ty] ||
            !map[ty][tx] ||
            map[ty][tx] === "#"
        ){
            resetPlayer();
            return;
        }
    }

    const px = player.x + player.size/2;
    const py = player.y + player.size/2;

    const fx = finishPos.x;
    const fy = finishPos.y;

    if(
        px > fx &&
        px < fx + tile &&
        py > fy &&
        py < fy + tile
    ){

        if(level === 2){
            playJumpscare();
        }else{
            nextLevel();
        }
    }
}

function nextLevel(){

    level++;

    if(level >= levels.length){
        alert("You Win!");
        level = 0;
    }

    loadLevel(level);
}

function playJumpscare(){

    const scare = document.getElementById("jumpscare");
    const video = document.getElementById("scareVideo");

    scare.style.display = "flex";

    video.currentTime = 0;
    video.play();

    video.onended = () => {
        scare.style.display = "none";
        nextLevel();
    };
}

function update(){

    if(keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
    if(keys["ArrowDown"] || keys["s"]) player.y += player.speed;
    if(keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
    if(keys["ArrowRight"] || keys["d"]) player.x += player.speed;

    checkCollision();
}

function gameLoop(){

    update();

    drawMap();
    drawPlayer();

    requestAnimationFrame(gameLoop);
}

window.addEventListener("keydown", e=>{
    keys[e.key] = true;
});

window.addEventListener("keyup", e=>{
    keys[e.key] = false;
});

function mobileButton(id, key){

    const btn = document.getElementById(id);

    btn.addEventListener("touchstart", e=>{
        e.preventDefault();
        keys[key] = true;
    });

    btn.addEventListener("touchend", e=>{
        e.preventDefault();
        keys[key] = false;
    });
}

mobileButton("up","w");
mobileButton("down","s");
mobileButton("left","a");
mobileButton("right","d");

loadLevel(level);
gameLoop();

</script>
</body>
</html>
